<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>یه سوال ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:tahoma, sans-serif;
}


body{

    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(
        135deg,
        #ff9a9e,
        #fad0c4,
        #ffd1ff
    );

    overflow:hidden;
}




.container{

    width:90%;
    max-width:430px;

    padding:40px 30px;

    text-align:center;

    background:rgba(255,255,255,0.35);

    backdrop-filter:blur(15px);

    border-radius:30px;

    box-shadow:
    0 20px 40px rgba(0,0,0,.15);

    border:1px solid rgba(255,255,255,.5);

}




.heart{

    font-size:70px;

    animation:beat 1.5s infinite;

}


@keyframes beat{

    50%{
        transform:scale(1.15);
    }

}



h1{

    margin-top:20px;

    color:#c2185b;

    font-size:32px;

}



#message{

    margin-top:20px;

    min-height:45px;

    font-size:19px;

    color:#7a2450;

}





.buttons{

    margin-top:40px;

    height:100px;

    position:relative;

}





button{

    position:relative;

    border:none;

    padding:15px 35px;

    border-radius:50px;

    font-size:20px;

    cursor:pointer;

    transition:.3s;

    font-weight:bold;

}



#yes{

    background:linear-gradient(
        45deg,
        #ff416c,
        #ff4b2b
    );

    color:white;

    box-shadow:
    0 10px 25px rgba(255,65,108,.4);

}



#no{

    background:white;

    color:#555;

    margin-right:15px;

    box-shadow:
    0 10px 25px rgba(0,0,0,.15);

}






.floating-heart{

    position:absolute;

    bottom:-50px;

    animation:float 8s linear infinite;

    opacity:.4;

}


@keyframes float{


    from{

        transform:translateY(0);

    }


    to{

        transform:translateY(-110vh);

    }

}



</style>

</head>



<body>


<div class="container">


<div class="heart">
❤️
</div>


<h1 id="question">
با من بیرون میای؟ 🥺
</h1>


<p id="message">
قول میدم خوش بگذره ☕✨
</p>



<div class="buttons">

<button id="yes">
بله ❤️
</button>


<button id="no">
خیر 🙈
</button>


</div>


</div>



<script>


const yes = document.getElementById("yes");
const no = document.getElementById("no");
const question = document.getElementById("question");
const message = document.getElementById("message");


let yesScale = 1;
let noScale = 1;


let counter = 0;



const messages = [

"🥺 مطمئنی؟",

"☕ فقط یه قهوه و یه گفتگوی خوب...",

"😊 قول میدم خوش بگذره.",

"🌸 شاید یه خاطره قشنگ بسازیم.",

"💖 هنوز امیدوارم جواب مثبت بدی.",

"😂 فکر کنم داری سخت می‌گیری!"

];





no.onclick=function(){


counter++;


yesScale +=0.15;

noScale -=0.12;



yes.style.transform = "scale(" + yesScale + ")";



let x = Math.random()*200-100;

let y = Math.random()*80-40;



no.style.transform =
`
scale(${Math.max(noScale,0.1)})
translate(${x}px,${y}px)
`;



if(counter < messages.length){

message.innerHTML =
messages[counter];

}



if(noScale <=0.15){

no.style.display="none";

message.innerHTML=
"❤️ فقط یه انتخاب مونده...";

}


};







no.onmouseover=function(){


let x = Math.random()*250-125;

let y = Math.random()*120-60;


no.style.transform =
"scale(" + noScale + ") translate(" + x + "px," + y + "px)";

}




yes.onclick=function(){



document.body.innerHTML=`

<div style="
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
text-align:center;
">


<h1 style="
font-size:60px;
color:#c2185b;
">
🎉❤️
</h1>


<h2 style="
margin-top:20px;
color:#7a2450;
">
خیلی خوشحال شدم 😍
</h2>


<p style="
font-size:22px;
margin-top:15px;
">
پس بزودی میبینمت  ☕✨
</p>


</div>

`;



};







for(let i=0;i<25;i++){


let heart=document.createElement("div");


heart.className="floating-heart";

heart.innerHTML="❤️";


heart.style.left=
Math.random()*100+"vw";
heart.style.fontSize=
(15+Math.random()*25)+"px";


heart.style.animationDuration=
(5+Math.random()*6)+"s";



document.body.appendChild(heart);


}



</script>


</body>

</html>
