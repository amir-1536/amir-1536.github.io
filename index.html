<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>یه سوال ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:tahoma, sans-serif;
}


body{

    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(
        135deg,
        #ff9a9e,
        #fad0c4,
        #ffd1ff
    );

    overflow:hidden;
}




.container{

    width:90%;
    max-width:430px;

    padding:40px 30px;

    text-align:center;

    background:rgba(255,255,255,0.35);

    backdrop-filter:blur(15px);

    border-radius:30px;

    box-shadow:
    0 20px 40px rgba(0,0,0,.15);

    border:1px solid rgba(255,255,255,.5);

}




.heart{

    font-size:70px;

    animation:beat 1.5s infinite;

}


@keyframes beat{

    50%{
        transform:scale(1.15);
    }

}



h1{

    margin-top:20px;

    color:#c2185b;

    font-size:32px;

}



#message{

    margin-top:20px;

    min-height:45px;

    font-size:19px;

    color:#7a2450;

}





.buttons{

    margin-top:40px;

    height:100px;

    position:relative;

}





button{

    position:relative;

    border:none;

    padding:15px 35px;

    border-radius:50px;

    font-size:20px;

    cursor:pointer;

    transition:.3s;

    font-weight:bold;

}



#yes{

    background:linear-gradient(
        45deg,
        #ff416c,
        #ff4b2b
    );

    color:white;

    box-shadow:
    0 10px 25px rgba(255,65,108,.4);

}



#no{

    background:white;

    color:#555;

    margin-right:15px;

    box-shadow:
    0 10px 25px rgba(0,0,0,.15);

}






.floating-heart{

    position:absolute;

    bottom:-50px;

    animation:float 8s linear infinite;

    opacity:.4;

}


@keyframes float{


    from{

        transform:translateY(0);

    }


    to{

        transform:translateY(-110vh);

    }

}



</style>

</head>



<body>


<div class="container">


<div class="heart">
❤️
</div>


<h1 id="question">
با من بیرون میای؟ 🥺
</h1>


<p id="message">
قول میدم خوش بگذره ☕✨
</p>



<div class="buttons">

<button id="yes">
بله ❤️
</button>


<button id="no">
خیر 🙈
</button>


</div>


</div>



<script type="module">



import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";





import { initializeApp } from "firebase/app";


const firebaseConfig = {
  apiKey: "AIzaSyAzqaMC-SB_bXEIQSpKIK7PJc_Y8yKbhhU",
  authDomain: "date-invitation-b3f9f.firebaseapp.com",
  projectId: "date-invitation-b3f9f",
  storageBucket: "date-invitation-b3f9f.firebasestorage.app",
  messagingSenderId: "90295219009",
  appId: "1:90295219009:web:83260db429ed2dca52a7c0"
};

const app = initializeApp(firebaseConfig);





const db = getFirestore(app);

const savedDate = localStorage.getItem("date");
const savedTime = localStorage.getItem("time");

const yes = document.getElementById("yes");
const no = document.getElementById("no");
const question = document.getElementById("question");
const message = document.getElementById("message");


let yesScale = 1;
let noScale = 1;


let counter = 0;



const messages = [

"🥺 مطمئنی؟",

"☕ فقط یه قهوه و یه گفتگوی خوب...",

"😊 قول میدم خوش بگذره.",

"🌸 شاید یه خاطره قشنگ بسازیم.",

"💖 هنوز امیدوارم جواب مثبت بدی.",

"😂 فکر کنم داری سخت می‌گیری!"

];





no.onclick=function(){


counter++;


yesScale +=0.15;

noScale -=0.12;



yes.style.transform = "scale(" + yesScale + ")";



let x = Math.random()*200-100;

let y = Math.random()*80-40;



no.style.transform =
`
scale(${Math.max(noScale,0.1)})
translate(${x}px,${y}px)
`;



if(counter < messages.length){

message.innerHTML =
messages[counter];

}



if(noScale <=0.15){

no.style.display="none";

message.innerHTML=
"❤️ فقط یه انتخاب مونده...";

}


};







no.onmouseover=function(){


let x = Math.random()*250-125;

let y = Math.random()*120-60;


no.style.transform =
"scale(" + noScale + ") translate(" + x + "px," + y + "px)";

}




yes.onclick = function () {

document.body.innerHTML = `

<div class="container">

<div class="heart">❤️</div>

<h1>عالیه! 😍</h1>

<p style="margin:20px 0;">
حالا یه تاریخ برای دیدارمون انتخاب کن ☕
</p>

<input type="date" id="date">

<br><br>

<input type="time" id="time">

<br><br>

<button id="save">
ثبت دیدار ❤️
</button>

<p id="result" style="margin-top:20px;"></p>

</div>

`;
}
const save = document.getElementById("save");

save.onclick = async function(){

const date=document.getElementById("date").value;
const time=document.getElementById("time").value;

await addDoc(collection(db,"dates"),{

date:date,

time:time,

createdAt:new Date()

});

alert("دیدار ثبت شد ❤️");

}





for(let i=0;i<25;i++){


let heart=document.createElement("div");


heart.className="floating-heart";

heart.innerHTML="❤️";


heart.style.left=
Math.random()*100+"vw";
heart.style.fontSize=
(15+Math.random()*25)+"px";


heart.style.animationDuration=
(5+Math.random()*6)+"s";



document.body.appendChild(heart);


}



</script>


</body>

</html>
